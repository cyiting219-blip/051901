<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>✊ 剪刀石頭布 — AI 手勢辨識</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/addons/p5.sound.min.js"></script>
  <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f5f5f5;
      margin-top: 20px;
    }
    h1 {
      color: #333;
    }
    #info-text {
      font-size: 18px;
      color: #666;
      margin-bottom: 15px;
    }
    canvas {
      border: 2px solid #ccc;
      border-radius: 8px;
    }
    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(245, 245, 245, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    #start-screen h2 {
      font-size: 36px;
      color: #333;
      margin-bottom: 20px;
    }
    #start-screen p {
      font-size: 24px;
      color: #555;
      margin: 10px 0;
    }
    #start-btn {
      margin-top: 30px;
      padding: 15px 30px;
      font-size: 24px;
      font-weight: bold;
      color: white;
      background-color: #9d4edd;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }
    #start-btn:hover {
      background-color: #7b2cbf;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="start-screen">
    <h2>✊ 剪刀石頭布 — AI 手勢辨識</h2>
    <p>👉 請比出 <strong>「手槍」</strong> 手勢（伸出大拇指與食指）來<strong>開始遊戲</strong></p>
    <p>🤙 請比出 <strong>「六」</strong> 手勢（伸出大拇指與小拇指）來<strong>結束遊戲</strong></p>
    <p style="font-size: 18px; margin-top: 30px; color: #888;">( 請確保已允許攝影機存取，並將手勢對準鏡頭 )</p>
    <button id="start-btn">開始遊戲</button>
  </div>

  <h1>✊ 剪刀石頭布 — AI 手勢辨識</h1>
  <div id="info-text">✊ 石頭 &ensp; 🖐 布 &ensp; ✌️ 剪刀 &ensp;|&ensp; AI 即時手勢辨識猜拳 — 請允許攝影機存取</div>

  <script src="sketch.js"></script>
</body>
</html>
